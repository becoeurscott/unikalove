services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: unika
      POSTGRES_PASSWORD: unika_dev
      POSTGRES_DB: unikalove
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
volumes:
  dbdata:
