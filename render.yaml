# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render dashboard → New → Blueprint → connect becoreurscott/unikalove
services:
  # --- NestJS API (Docker: needs a persistent container for Socket.IO) --------
  - type: web
    name: unikalove-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free            # free instances sleep after ~15 min idle
    region: frankfurt     # closest Render region to West/Central Africa
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # Supabase hosts Postgres — set both in the dashboard.
      # DATABASE_URL = pooled (port 6543, ?pgbouncer=true), DIRECT_URL = direct (5432)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: unikalove-redis
          property: connectionString
      # Secrets are generated once by Render and kept out of the repo.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL_DAYS
        value: "7"
      - key: PORT
        value: "4000"
      - key: NODE_ENV
        value: production
      # Set these in the dashboard once the frontends are deployed.
      - key: CORS_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      # AI + payments: paste values in the dashboard (never commit them).
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: anthropic/claude-opus-5
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AI_TIMEOUT_MS
        value: "45000"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PREMIUM
        sync: false
      - key: STRIPE_PRICE_PREMIUM_PLUS
        sync: false

  # --- Redis (caches, AI budgets). The app degrades gracefully without it. ----
  - type: keyvalue
    name: unikalove-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []       # reachable only from inside Render
